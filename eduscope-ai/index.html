<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EduScope AI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#4f46e5;--nav:#0b1230;--ok:#059669;--wr:#d97706;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0f1f;--card:#131a30;--tx:#e6eaf5;--mu:#94a3b8;--bd:#243050}}
:root[data-theme=dark]{--bg:#0a0f1f;--card:#131a30;--tx:#e6eaf5;--mu:#94a3b8;--bd:#243050}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--nav);padding:16px 10px;overflow:auto;z-index:5}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:16px;padding:4px 8px 18px}.logo span{background:linear-gradient(135deg,#4f46e5,#06b6d4);border-radius:9px;width:30px;height:30px;display:grid;place-items:center}
nav a{display:flex;gap:10px;align-items:center;color:#a5b0d0;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none;margin-bottom:2px}nav a:hover{background:#18214a;color:#fff}nav a.on{background:#27307a;color:#fff}
nav svg{width:16px;height:16px}
main{margin-left:220px;min-height:100vh}
header{display:flex;gap:10px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:160px}header small{color:var(--mu);display:block;font-weight:400;font-size:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #06b6d4;outline-offset:1px}
#v{padding:20px 24px;max-width:1280px}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card h3{margin:0 0 10px;font-size:14px}.kv{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.cv{position:relative;height:260px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;cursor:pointer;font-size:12px}tbody tr:hover{background:rgba(99,102,241,.08)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.note{border-left:3px solid var(--wr);background:rgba(217,119,6,.1);padding:10px 12px;border-radius:6px;margin-bottom:14px}.er{border-left-color:var(--er);background:rgba(220,38,38,.1)}
.empty{text-align:center;padding:48px 16px}.empty svg{width:36px;height:36px;color:var(--ac)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);padding:20px;overflow:auto;z-index:9;transform:translateX(100%);transition:transform .2s}#dr.o{transform:none}
@media(max-width:800px){aside{position:static;width:auto;display:flex;overflow-x:auto;padding:8px}.logo{padding:4px 10px}nav{display:flex}nav a{white-space:nowrap}main{margin-left:0}#v,header{padding-left:14px;padding-right:14px}}
@media print{aside,header,.bar,#dr{display:none}main{margin:0}}
</style></head><body>
<aside><div class="logo"><span><i data-lucide="graduation-cap" style="color:#fff;width:17px"></i></span>EduScope AI</div><nav id="nav"></nav></aside>
<main><header><h1 id="ttl"></h1><input id="gs" type="search" placeholder="Search student ID" aria-label="Search student ID" style="width:170px"><span class="mu" id="ts"></span><button id="bs" aria-label="Backend status, click to retry">Backend: checking…</button><button id="th" aria-label="Toggle theme"><i data-lucide="moon"></i></button><button id="bl" aria-label="Notifications"><i data-lucide="bell"></i><b id="bc"></b></button><span class="tag" style="background:#4f46e5">Advisor</span></header>
<div id="v"></div></main><div id="dr" role="dialog" aria-label="Student profile"></div>
<script>
const R=[['overview','Overview','layout-dashboard'],['explorer','Student Explorer','users'],['warning','Early Warning','triangle-alert'],['predict','Predictions','sparkles'],['engage','Engagement Analytics','activity'],['course','Course Analytics','book-open'],['model','Model Performance','flask-conical'],['reports','Reports','file-text'],['data','Data Management','database'],['settings','Settings','settings']];
const OUT=['Distinction','Fail','Pass','Withdrawn'],COL={Distinction:'#06b6d4',Fail:'#ef4444',Pass:'#6366f1',Withdrawn:'#f59e0b'};
const REQ=['code_module','code_presentation','id_student','gender','highest_education','age_band','num_of_prev_attempts','studied_credits','days_before_start_registered','clicks_by_day30','active_days_by_day30','assessments_submitted_by_day30','average_score_by_day30','final_result'];
const NUM=['id_student','num_of_prev_attempts','studied_credits','days_before_start_registered','clicks_by_day30','active_days_by_day30','assessments_submitted_by_day30','average_score_by_day30'];
let D=[],info=null,route='overview',F={m:'',p:'',o:''},E={q:'',o:'',m:'',k:'clicks_by_day30',d:-1,pg:0},ch={},ts='';
const $=s=>document.querySelector(s);
const ls={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=ls.g('es_cfg',{thr:5,api:location.protocol.startsWith('http')?location.origin:'http://localhost:5000'}),rev=ls.g('es_rev',{});
if(ls.g('es_theme',''))document.documentElement.dataset.theme=ls.g('es_theme','');
const fmt=n=>n==null?'Not available':(+n).toLocaleString(undefined,{maximumFractionDigits:1}),pc=(a,b)=>b?(100*a/b).toFixed(1)+'%':'–';
const avg=(a,f)=>{const v=a.map(f).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
const uniq=f=>[...new Set(D.map(r=>r[f]))].sort();
const key=r=>r.code_module+'|'+r.code_presentation+'|'+r.id_student;
function parse(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!='')rows.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
function load(name,text){const rows=parse(text),h=rows[0].map(x=>x.trim()),miss=REQ.filter(c=>!h.includes(c));
 if(miss.length){info={name,err:'Missing required columns: '+miss.join(', ')};return}
 const o=rows.slice(1).map(r=>{const x={};h.forEach((c,i)=>{let v=(r[i]||'').trim();x[c]=NUM.includes(c)?(v===''||/^(na|nan|null)$/i.test(v)?null:+v):v});return x});
 const seen=new Set();let dup=0;o.forEach(r=>{const k=key(r);seen.has(k)?dup++:seen.add(k)});
 const mv={};h.forEach(c=>{const n=o.filter(r=>r[c]===null||r[c]==='').length;if(n)mv[c]=n});
 const bad=o.filter(r=>!OUT.includes(r.final_result)).length;
 D=o;ts=new Date().toLocaleString();info={name,rows:o.length,cols:h.length,dup,mv,bad,h}}
function can(){return D.length}
function filt(){return D.filter(r=>(!F.m||r.code_module==F.m)&&(!F.p||r.code_presentation==F.p)&&(!F.o||r.final_result==F.o))}
function mk(id,c){if(ch[id])ch[id].destroy();const el=document.getElementById(id);if(!el)return;c.options=Object.assign({responsive:true,maintainAspectRatio:false},c.options||{});ch[id]=new Chart(el,c)}
function hist(a,n){const v=a.filter(x=>x!=null);if(!v.length)return{l:[],c:[]};const mx=Math.max(...v),w=Math.max(1,Math.ceil((mx+1)/n)),c=Array(Math.ceil((mx+1)/w)).fill(0);v.forEach(x=>c[Math.floor(x/w)]++);return{l:c.map((_,i)=>i*w+'–'+((i+1)*w-1)),c}}
function csv(rows,cols){const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
const tag=o=>o?`<span class="tag" style="background:${COL[o]||'#64748b'}">${o}</span>`:'–';
function bar(){const mods=uniq('code_module'),ps=uniq('code_presentation');return`<div class="bar"><select id="fm" aria-label="Module"><option value="">All modules</option>${mods.map(x=>`<option ${F.m==x?'selected':''}>${x}</option>`)}</select><select id="fp" aria-label="Presentation"><option value="">All presentations</option>${ps.map(x=>`<option ${F.p==x?'selected':''}>${x}</option>`)}</select><select id="fo" aria-label="Outcome"><option value="">All outcomes</option>${OUT.map(x=>`<option ${F.o==x?'selected':''}>${x}</option>`)}</select></div>`}
function bindBar(){['m','p','o'].forEach(k=>{const e=$('#f'+k);if(e)e.onchange=()=>{F[k]=e.value;draw()}})}
function onboard(){return`<div class="card empty"><i data-lucide="upload-cloud"></i><h2>Load your day-30 feature file</h2><p class="mu" style="max-width:520px;margin:0 auto 14px">EduScope AI only shows real data. Upload <b>oulad_day30_features_audited.csv</b>. It is parsed in your browser and never uploaded anywhere. No sample data is substituted.</p><button class="p" onclick="go('data')">Go to Data Management</button></div>`}
function go(r){route=r;location.hash=r;draw()}
function draw(){const cur=R.find(x=>x[0]==route);$('#nav').innerHTML=R.map(x=>`<a tabindex="0" class="${x[0]==route?'on':''}" onclick="go('${x[0]}')" onkeydown="if(event.key=='Enter')go('${x[0]}')"><i data-lucide="${x[2]}"></i>${x[1]}</a>`).join('');
 $('#ttl').innerHTML=cur[1]+`<small>EduScope AI / ${cur[1]}</small>`;$('#ts').textContent=ts?'Data loaded '+ts:'No data loaded';
 const fl=D.filter(r=>r.active_days_by_day30!=null&&r.active_days_by_day30<cfg.thr).length;$('#bc').textContent=fl?' '+fl:'';
 const needs=['overview','explorer','warning','engage','course','reports'].includes(route);
 $('#v').innerHTML=needs&&!can()?onboard():P[route]();(A[route]||(()=>{}))();bindBar();lucide.createIcons()}
const P={},A={};
const note='<div class="note">A record is one student in one course presentation, not a unique person. Figures are descriptive. They do not show causes.</div>';
P.overview=()=>{const d=filt(),n=d.length,c=o=>d.filter(r=>r.final_result==o).length,low=d.filter(r=>r.active_days_by_day30!=null&&r.active_days_by_day30<cfg.thr).length;
 const K=(a,b,s)=>`<div class="card"><div class="mu">${a}</div><div class="kv">${b}</div><div class="mu">${s||''}</div></div>`;
 const hi=n&&OUT.slice().sort((a,b)=>c(b)-c(a))[0];
 return bar()+note+`<div class="g k">${K('Student-course records',n.toLocaleString())}${OUT.map(o=>K(o+' rate',pc(c(o),n),c(o).toLocaleString()+' records')).join('')}${K('Low-engagement screen',low.toLocaleString(),'Active days < '+cfg.thr+' (adjust in Settings)')}${K('Avg clicks, first 30 days',fmt(avg(d,r=>r.clicks_by_day30)))}${K('Avg active days, first 30 days',fmt(avg(d,r=>r.active_days_by_day30)))}</div><br>
 <div class="g c2"><div class="card"><h3>Outcome distribution</h3><div class="cv"><canvas id="c1"></canvas></div></div><div class="card"><h3>Outcomes by module (%)</h3><div class="cv"><canvas id="c2"></canvas></div></div><div class="card"><h3>Active days distribution</h3><div class="cv"><canvas id="c3"></canvas></div></div><div class="card"><h3>Active days vs clicks (sample)</h3><div class="cv"><canvas id="c4"></canvas></div></div></div><br>
 <div class="card"><h3>Summary of loaded data</h3><p>${n?`In this selection, ${hi} is the most common outcome (${pc(c(hi),n)}). Average first-30-day active days is ${fmt(avg(d,r=>r.active_days_by_day30))}, and ${fmt(100*d.filter(r=>r.average_score_by_day30==null).length/n)}% of records have no early assessment score. These are observations, not explanations.`:'No records match these filters.'}</p></div>`}
A.overview=()=>{const d=filt();mk('c1',{type:'doughnut',data:{labels:OUT,datasets:[{data:OUT.map(o=>d.filter(r=>r.final_result==o).length),backgroundColor:OUT.map(o=>COL[o])}]},options:{plugins:{legend:{position:'bottom'}}}});stack('c2',d);
 const h=hist(d.map(r=>r.active_days_by_day30),12);mk('c3',{type:'bar',data:{labels:h.l,datasets:[{label:'Records',data:h.c,backgroundColor:'#4f46e5'}]},options:{plugins:{legend:{display:false}}}});scat('c4',d)}
function stack(id,d){const m=[...new Set(d.map(r=>r.code_module))].sort();mk(id,{type:'bar',data:{labels:m,datasets:OUT.map(o=>({label:o,backgroundColor:COL[o],data:m.map(x=>{const g=d.filter(r=>r.code_module==x);return g.length?100*g.filter(r=>r.final_result==o).length/g.length:0})}))},options:{scales:{x:{stacked:true},y:{stacked:true,max:100}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1)+'%'}}}}})}
function scat(id,d){const s=d.filter((_,i)=>i%Math.ceil(d.length/2000||1)==0);mk(id,{type:'scatter',data:{datasets:OUT.map(o=>({label:o,backgroundColor:COL[o]+'99',pointRadius:2,data:s.filter(r=>r.final_result==o&&r.clicks_by_day30!=null).map(r=>({x:r.active_days_by_day30,y:r.clicks_by_day30}))}))},options:{scales:{x:{title:{display:true,text:'Active days by day 30'}},y:{title:{display:true,text:'Clicks by day 30'}}}}})}
const COLS=[['id_student','Student ID'],['code_module','Module'],['code_presentation','Presentation'],['gender','Gender'],['age_band','Age band'],['highest_education','Education'],['num_of_prev_attempts','Prev. attempts'],['studied_credits','Credits'],['clicks_by_day30','Clicks d30'],['active_days_by_day30','Active days d30'],['assessments_submitted_by_day30','Early submissions'],['average_score_by_day30','Avg early score'],['final_result','Actual outcome']];
function exRows(){const q=E.q.trim();let d=D.filter(r=>(!q||String(r.id_student).includes(q))&&(!E.o||r.final_result==E.o)&&(!E.m||r.code_module==E.m));return d.sort((a,b)=>{const x=a[E.k],y=b[E.k];return x==y?0:x==null?1:y==null?-1:(x>y?1:-1)*E.d})}
P.explorer=()=>{const d=exRows(),pg=Math.min(E.pg,Math.max(0,Math.ceil(d.length/15)-1)),s=d.slice(pg*15,pg*15+15);
 return`<div class="bar"><input id="eq" placeholder="Search student ID" value="${E.q}"><select id="em"><option value="">All modules</option>${uniq('code_module').map(x=>`<option ${E.m==x?'selected':''}>${x}</option>`)}</select><select id="eo"><option value="">All outcomes</option>${OUT.map(x=>`<option ${E.o==x?'selected':''}>${x}</option>`)}</select><button onclick="dl('students.csv',csv(exRows(),COLS.map(c=>c[0])))"><i data-lucide="download"></i> Export CSV</button><span class="mu">${d.length.toLocaleString()} records. Predictions: none generated yet.</span></div>
 ${d.length?`<div class="card tw"><table><thead><tr>${COLS.map(c=>`<th onclick="E.k='${c[0]}';E.d*=-1;draw()">${c[1]}${E.k==c[0]?(E.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${s.map(r=>`<tr tabindex="0" style="cursor:pointer" onclick="prof('${key(r)}')">${COLS.map(c=>`<td>${c[0]=='final_result'?tag(r[c[0]]):r[c[0]]==null||r[c[0]]===''?'<span class="mu">Not available</span>':r[c[0]]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="bar" style="margin-top:12px"><button ${pg?'':'disabled'} onclick="E.pg=${pg-1};draw()">Previous</button><span>Page ${pg+1} of ${Math.ceil(d.length/15)}</span><button ${(pg+1)*15<d.length?'':'disabled'} onclick="E.pg=${pg+1};draw()">Next</button></div>`:'<div class="card empty"><h3>No records match</h3><p class="mu">Clear the search or filters to see records again.</p></div>'}`}
A.explorer=()=>{[['eq','q'],['em','m'],['eo','o']].forEach(([i,k])=>{const e=$('#'+i);e.oninput=e.onchange=()=>{E[k]=e.value;E.pg=0;const p=e.selectionStart;draw();const n=$('#'+i);if(i=='eq'){n.focus();n.setSelectionRange(p,p)}}})}
function prof(k){const r=D.find(x=>key(x)==k),a=r.active_days_by_day30,v=rev[k]||{};const row=(l,x)=>`<tr><td class="mu">${l}</td><td>${x==null||x===''?'Not available':x}</td></tr>`;
 $('#dr').innerHTML=`<button onclick="$('#dr').classList.remove('o')" style="float:right">Close</button><h2>Student ${r.id_student}</h2><p class="mu">${r.code_module} · ${r.code_presentation}</p><table>${[['Gender',r.gender],['Age band',r.age_band],['Highest education',r.highest_education],['Previous attempts',r.num_of_prev_attempts],['Studied credits',r.studied_credits],['Registered (days before start)',r.days_before_start_registered],['Clicks by day 30',r.clicks_by_day30],['Active days by day 30',a],['Early submissions',r.assessments_submitted_by_day30],['Avg early score',r.average_score_by_day30]].map(x=>row(...x)).join('')}</table><p>Actual outcome (historical): ${tag(r.final_result)}</p><p>Predicted outcome: <span class="mu">No prediction generated</span></p><div class="note">Feature explanations: Coming soon. None are shown until a valid explainability method is computed.</div><p>${a!=null&&a<cfg.thr?'Observed low activity in the first 30 days. A friendly check-in to ask what would help may be useful.':'No low-engagement signal under the current threshold.'} Activity alone does not predict an outcome. Advisor judgment applies.</p><p class="mu">Review status: ${v.s||'Not reviewed'}</p>`;$('#dr').classList.add('o')}
const ST=['Not reviewed','Under review','Support recommended','Follow-up completed'];
function queue(){return D.filter(r=>r.active_days_by_day30!=null&&r.active_days_by_day30<cfg.thr).sort((a,b)=>a.active_days_by_day30-b.active_days_by_day30||a.clicks_by_day30-b.clicks_by_day30)}
P.warning=()=>{const q=queue(),m=F.m?q.filter(r=>r.code_module==F.m):q,s=m.slice(0,50);
 return`<div class="note">Queue is based on <b>observed engagement only</b> (active days by day 30 &lt; ${cfg.thr}). No model predictions are loaded, so none are used. Statuses and notes are saved <b>locally in this browser</b> (prototype). Support, not punishment.</div><div class="bar"><select id="fm"><option value="">All modules</option>${uniq('code_module').map(x=>`<option ${F.m==x?'selected':''}>${x}</option>`)}</select><button onclick="dl('review_queue.csv',csv(m.map(r=>({...r,review_status:(rev[key(r)]||{}).s||'Not reviewed',note:(rev[key(r)]||{}).n||''})),['code_module','code_presentation','id_student','clicks_by_day30','active_days_by_day30','review_status','note']))">Export queue</button><span><b>${m.length.toLocaleString()}</b> students to review. Showing the 50 lowest-activity.</span></div><div class="card tw"><table><thead><tr><th>Student</th><th>Module</th><th>Active days</th><th>Clicks</th><th>Status</th><th>Advisor note / next action</th></tr></thead><tbody>${s.map(r=>{const k=key(r),v=rev[k]||{};return`<tr><td><a href="#" onclick="prof('${k}');return false">${r.id_student}</a></td><td>${r.code_module} ${r.code_presentation}</td><td>${r.active_days_by_day30}</td><td>${fmt(r.clicks_by_day30)}</td><td><select aria-label="Status" onchange="sv('${k}','s',this.value)">${ST.map(x=>`<option ${v.s==x?'selected':''}>${x}</option>`)}</select></td><td><input aria-label="Note" value="${(v.n||'').replace(/"/g,'&quot;')}" onchange="sv('${k}','n',this.value)" placeholder="Next action"></td></tr>`}).join('')}</tbody></table></div>`}
function sv(k,f,v){rev[k]=rev[k]||{};rev[k][f]=v;ls.s('es_rev',rev)}
P.predict=()=>{const ids=D.slice(0,0);return`<div class="note">Predictions come only from the Flask backend (${cfg.api}). If it is offline you will see an error, never a simulated result. The primary model excludes the day-30 score; tick the box for the experimental score model.</div><div class="card"><h3>Request a prediction</h3>${can()?`<div class="bar"><input id="pid" placeholder="Student ID" list="pl"><datalist id="pl">${D.slice(0,200).map(r=>`<option value="${r.id_student}">`).join('')}</datalist><label><input type="checkbox" id="ns"> Use experimental day-30 score model (score availability unverified)</label><button class="p" onclick="pred()">Predict</button></div>`:'<p class="mu">Load a dataset first.</p>'}<div id="pr" style="margin-top:12px"></div><p class="mu">Features sent: all columns except final_result and id_student. Cutoff: course day 30. Only labels Distinction, Fail, Pass, Withdrawn are accepted. Probabilities are shown as model-estimated class probabilities, not calibrated.</p><details><summary>API contract</summary><pre class="mu">POST ${cfg.api}/api/predict → {predicted_outcome, class_probabilities?, model_version, feature_cutoff, prediction_mode}</pre></details></div>`}
async function pred(){const id=$('#pid').value.trim(),r=D.find(x=>String(x.id_student)==id),o=$('#pr');if(!r){o.innerHTML='<span style="color:var(--er)">Enter a student ID that exists in the loaded data.</span>';return}
 const b={...r};delete b.final_result;delete b.id_student;b.use_score=$('#ns').checked;if(!b.use_score)b.average_score_by_day30=null;o.textContent='Requesting…';
 try{const x=await fetch(cfg.api+'/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await x.json();if(!x.ok)throw new Error(j.error||x.status);if(!OUT.includes(j.predicted_outcome))throw new Error('Unexpected label from API');
 o.innerHTML=`Predicted: ${tag(j.predicted_outcome)} <span class="mu">${j.model_version||''}, ${j.feature_cutoff||''}</span>${j.class_probabilities?'<p class="mu">Model-estimated class probability</p>'+OUT.map(c=>`${c}: ${(100*j.class_probabilities[c]).toFixed(1)}%`).join('<br>'):''}<p class="mu">Actual (historical): ${r.final_result}</p>`}
 catch(e){o.innerHTML=`<span style="color:var(--er)">Could not get a prediction from ${cfg.api}: ${e.message}. Check that the backend is running and allows this origin (CORS).</span>`}}
P.engage=()=>bar()+note+`<div class="g c2"><div class="card"><h3>Clicks distribution (log of count)</h3><div class="cv"><canvas id="e1"></canvas></div></div><div class="card"><h3>Active days distribution</h3><div class="cv"><canvas id="e2"></canvas></div></div><div class="card"><h3>Clicks vs active days (sample)</h3><div class="cv"><canvas id="e3"></canvas></div></div><div class="card"><h3>Average engagement by actual outcome</h3><div class="cv"><canvas id="e4"></canvas></div></div><div class="card"><h3>Early assessment score distribution</h3><div class="cv"><canvas id="e5"></canvas></div></div><div class="card"><h3>Average active days by module</h3><div class="cv"><canvas id="e6"></canvas></div></div></div><p class="mu">Daily engagement trends need studentVle day-level records, which are not loaded.</p>`;
A.engage=()=>{const d=filt(),H=(id,a,n,c)=>{const h=hist(a,n);mk(id,{type:'bar',data:{labels:h.l,datasets:[{label:'Records',data:h.c,backgroundColor:c}]},options:{plugins:{legend:{display:false}}}})};
 H('e1',d.map(r=>r.clicks_by_day30),15,'#4f46e5');H('e2',d.map(r=>r.active_days_by_day30),12,'#06b6d4');scat('e3',d);H('e5',d.map(r=>r.average_score_by_day30),10,'#7c3aed');
 mk('e4',{type:'bar',data:{labels:OUT,datasets:[{label:'Avg active days',data:OUT.map(o=>avg(d.filter(r=>r.final_result==o),r=>r.active_days_by_day30)),backgroundColor:'#06b6d4'},{label:'Avg clicks ÷ 10',data:OUT.map(o=>(avg(d.filter(r=>r.final_result==o),r=>r.clicks_by_day30)||0)/10),backgroundColor:'#4f46e5'}]}});
 const m=[...new Set(d.map(r=>r.code_module))].sort();mk('e6',{type:'bar',data:{labels:m,datasets:[{label:'Avg active days',data:m.map(x=>avg(d.filter(r=>r.code_module==x),r=>r.active_days_by_day30)),backgroundColor:'#06b6d4'}]}})}
P.course=()=>{const d=filt(),m=[...new Set(d.map(r=>r.code_module))].sort();return bar()+note+`<div class="g c2"><div class="card"><h3>Outcome mix by module</h3><div class="cv"><canvas id="o1"></canvas></div></div><div class="card"><h3>Outcome mix by presentation</h3><div class="cv"><canvas id="o2"></canvas></div></div></div><br><div class="card tw"><h3>Descriptive statistics (historical)</h3><table><thead><tr><th>Module</th><th>Records</th><th>Fail</th><th>Withdrawn</th><th>Avg clicks</th><th>Avg active days</th><th>Avg early score</th></tr></thead><tbody>${m.map(x=>{const g=d.filter(r=>r.code_module==x);return`<tr><td>${x}</td><td>${g.length}</td><td>${pc(g.filter(r=>r.final_result=='Fail').length,g.length)}</td><td>${pc(g.filter(r=>r.final_result=='Withdrawn').length,g.length)}</td><td>${fmt(avg(g,r=>r.clicks_by_day30))}</td><td>${fmt(avg(g,r=>r.active_days_by_day30))}</td><td>${fmt(avg(g,r=>r.average_score_by_day30))}</td></tr>`}).join('')}</tbody></table></div>`}
A.course=()=>{const d=filt();stack('o1',d);const p=[...new Set(d.map(r=>r.code_presentation))].sort();mk('o2',{type:'bar',data:{labels:p,datasets:OUT.map(o=>({label:o,backgroundColor:COL[o],data:p.map(x=>{const g=d.filter(r=>r.code_presentation==x);return 100*g.filter(r=>r.final_result==o).length/g.length})}))},options:{scales:{x:{stacked:true},y:{stacked:true,max:100}}}})}
const M=[['Majority baseline',.3792,.1375,null],['Logistic Regression',.4654,.4516,.4740],['Decision Tree',.4683,.4512,.4839],['Random Forest',.5268,.4950,.5342],['XGBoost',.5765,.4700,.5468],['Tuned Random Forest',.5280,.4984,.5356],['Tuned XGBoost',.5732,.4714,.5455]];
P.model=()=>`<div class="card" id="live" style="margin-bottom:14px">Loading backend metrics…</div><div class="note">Historical Colab experiment results. They do <b>not</b> describe the current backend model. Measured metrics of the loaded model appear in the card above.</div><div class="g c2"><div class="card tw"><h3>Initial and tuned comparison (stratified random 80/20, 6,519 test records)</h3><table><thead><tr><th>Model</th><th>Accuracy</th><th>Macro F1</th><th>Weighted F1</th></tr></thead><tbody>${M.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]??'–'}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Accuracy vs macro F1</h3><div class="cv"><canvas id="m1"></canvas></div></div><div class="card tw"><h3>Untuned Random Forest, per class</h3><table><thead><tr><th>Class</th><th>Precision</th><th>Recall</th><th>F1</th></tr></thead><tbody><tr><td>Distinction</td><td>0.31</td><td>0.51</td><td>0.39</td></tr><tr><td>Fail</td><td>0.38</td><td>0.38</td><td>0.38</td></tr><tr><td>Pass</td><td>0.56</td><td>0.57</td><td>0.57</td></tr><tr><td>Withdrawn</td><td>0.72</td><td>0.58</td><td>0.64</td></tr></tbody></table><p class="mu">Macro F1 averages F1 across classes equally, so it is useful when class sizes differ.</p></div><div class="card tw"><h3>Audited day-30 feature experiment</h3><table><thead><tr><th>Setup</th><th>Acc.</th><th>Macro F1</th><th>Wtd F1</th><th>Fail R</th><th>Wdr R</th><th>Dist R</th></tr></thead><tbody><tr><td>With day-30 score</td><td>0.50</td><td>0.49</td><td>0.52</td><td>0.42</td><td>0.54</td><td>0.61</td></tr><tr><td>Without score</td><td>0.4938</td><td>0.4713</td><td>0.5086</td><td>0.41</td><td>0.55</td><td>0.56</td></tr></tbody></table><p class="mu">Configurations differed, so this is not one controlled comparison with the table above.</p></div><div class="card"><h3>Limitations</h3><ul><li>Random split can put one presentation in both train and test, so it does not prove generalization to new presentations.</li><li>Day-30 score availability is unconfirmed. Marks may not have been known by day 30.</li><li>id_student and final_result are never model inputs. The full-course 26-column dataset is not valid for day-30 prediction.</li></ul></div><div class="card"><h3>Other artifacts</h3><p>Course-presentation holdout and confusion matrices: see the backend card above (only after training).<br>Feature set: 14 audited day-30 features (excluding id_student, target).</p></div></div>`;
A.model=()=>{live();mk('m1',{type:'bar',data:{labels:M.map(r=>r[0]),datasets:[{label:'Accuracy',data:M.map(r=>r[1]),backgroundColor:'#4f46e5'},{label:'Macro F1',data:M.map(r=>r[2]),backgroundColor:'#06b6d4'}]},options:{scales:{y:{max:.7}}}})};
P.reports=()=>{const d=D;return`<div class="bar"><button onclick="dl('dataset_summary.csv',csv(['Distinction','Fail','Pass','Withdrawn'].map(o=>({outcome:o,records:D.filter(r=>r.final_result==o).length,share:(100*D.filter(r=>r.final_result==o).length/D.length).toFixed(2)+'%'})),['outcome','records','share']))">Dataset summary CSV</button><button onclick="dl('course_summary.csv',csv(uniq('code_module').map(m=>{const g=D.filter(r=>r.code_module==m);return{module:m,records:g.length,fail:pc(g.filter(r=>r.final_result=='Fail').length,g.length),withdrawn:pc(g.filter(r=>r.final_result=='Withdrawn').length,g.length),avg_clicks:avg(g,r=>r.clicks_by_day30)?.toFixed(1)}}),['module','records','fail','withdrawn','avg_clicks']))">Course summary CSV</button><button onclick="dl('review_queue.csv',csv(queue(),['code_module','code_presentation','id_student','clicks_by_day30','active_days_by_day30']))">Review queue CSV</button><button class="p" onclick="print()">Print report</button></div><div class="card"><h2>EduScope AI executive report</h2><p class="mu">Source: ${info.name}. Filters: none. Generated ${new Date().toLocaleString()}.</p><p>${d.length.toLocaleString()} student-course records. ${['Distinction','Fail','Pass','Withdrawn'].map(o=>o+' '+pc(d.filter(r=>r.final_result==o).length,d.length)).join(', ')}.</p><p>${queue().length.toLocaleString()} records have fewer than ${cfg.thr} active days in the first 30 days (screening rule, not a prediction).</p><p class="mu">Model results are historical Colab experiments (see Model Performance). Predictions support advisor judgment and do not replace it.</p></div>`}
P.data=()=>`<div class="card"><h3>Upload processed day-30 CSV</h3><input type="file" id="fi" accept=".csv" aria-label="CSV file"><p class="mu">Parsed locally in your browser. Files are read as text only, never executed. Raw OULAD files (studentVle etc.) are not yet supported.</p></div><br>${info?info.err?`<div class="note er"><b>${info.name}</b>: ${info.err}</div>`:`<div class="card"><h3>${info.name}</h3><p>${info.rows.toLocaleString()} rows × ${info.cols} columns. Duplicate module-presentation-student keys: <b>${info.dup}</b>. Rows with invalid final_result: <b>${info.bad}</b>.</p><p>Missing values: ${Object.keys(info.mv).length?Object.entries(info.mv).map(([k,v])=>k+' '+v+' ('+pc(v,info.rows)+')').join(', '):'none'}</p><p>Target: ${OUT.map(o=>o+' '+D.filter(r=>r.final_result==o).length).join(', ')}</p><div class="tw"><table><thead><tr>${info.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${D.slice(0,8).map(r=>`<tr>${info.h.map(h=>`<td>${r[h]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`:'<div class="card empty"><h3>No file loaded</h3><p class="mu">Choose oulad_day30_features_audited.csv above.</p></div>'}`;
A.data=()=>{$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/\.csv$/i.test(f.name)){info={name:f.name,err:'Only .csv files are accepted.'};draw();return}const r=new FileReader();r.onload=()=>{try{load(f.name,r.result)}catch(x){info={name:f.name,err:'Could not parse file: '+x.message}}draw();if(!info.err)up(f)};r.readAsText(f)}};
P.settings=()=>`<div class="card"><h3>Engagement review threshold</h3><label>Flag records with active days by day 30 below <input type="number" id="st" min="1" max="30" value="${cfg.thr}" style="width:70px"></label><h3 style="margin-top:16px">Prediction API URL</h3><input id="sa" value="${cfg.api}" style="width:100%;max-width:400px"><h3 style="margin-top:16px">Prediction feature set</h3><p class="mu">Model metadata: none loaded. Toggle the score feature per request on Predictions.</p><button class="p" id="ss">Save settings</button> <button id="sr">Reset local review data</button><div class="note" style="margin-top:16px">Predictions support, but do not replace, academic advisor judgment.</div></div>`;
A.settings=()=>{$('#ss').onclick=()=>{const t=+$('#st').value;if(!(t>=1&&t<=30)){alert('Enter a threshold between 1 and 30.');return}cfg={thr:t,api:$('#sa').value.replace(/\/$/,'')};ls.s('es_cfg',cfg);draw()};$('#sr').onclick=()=>{if(confirm('Delete locally saved review statuses and notes?')){rev={};ls.s('es_rev',{})}}};
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;ls.s('es_theme',t)};
$('#gs').onkeydown=e=>{if(e.key=='Enter'){E.q=e.target.value;E.pg=0;go('explorer')}};
$('#bl').onclick=()=>go('warning');
async function health(){const b=$('#bs');b.textContent='Backend: checking…';try{const r=await fetch(cfg.api+'/api/health'),j=await r.json();b.textContent='Backend: online'+(j.models.length?'':' (no model trained)');b.style.color='var(--ok)';return j}catch(e){b.textContent='Backend: offline (click to retry)';b.style.color='var(--er)';return null}}
async function pull(){const j=await health();if(j&&j.dataset_loaded){try{const r=await fetch(cfg.api+'/api/students/all'),a=await r.json();if(!r.ok)throw new Error(a.error);D=a.records;info=a.info;info.name='Backend: '+j.dataset_file;ts=new Date().toLocaleString();draw()}catch(e){alert('Could not load backend data: '+e.message)}}}
async function up(f){const fd=new FormData();fd.append('file',f);try{const r=await fetch(cfg.api+'/api/dataset/upload',{method:'POST',body:fd}),j=await r.json();alert(r.ok?'Saved to backend ('+j.rows+' rows). Re-run train_model.py to retrain.':'Backend rejected the file: '+j.error)}catch(e){alert('Backend offline. File loaded in the browser only.')}}
async function live(){const e=$('#live');if(!e)return;try{const r=await fetch(cfg.api+'/api/model/metrics'),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);e.innerHTML='<h3>Current backend model: measured evaluation</h3>'+j.evaluations.map(m=>`<h4>${m.name}</h4><p class="mu">${m.model_type}. Split: ${m.split}. Train ${m.train_size.toLocaleString()} / test ${m.test_size.toLocaleString()} records. Features: ${m.features.join(', ')}</p><p>Accuracy <b>${m.accuracy.toFixed(4)}</b>, macro F1 <b>${m.macro_f1.toFixed(4)}</b>, weighted F1 <b>${m.weighted_f1.toFixed(4)}</b></p><div class="tw"><table><thead><tr><th>Class</th><th>Precision</th><th>Recall</th><th>F1</th><th>Support</th></tr></thead><tbody>${m.labels.map(l=>{const c=m.per_class[l];return`<tr><td>${l}</td><td>${c.precision.toFixed(2)}</td><td>${c.recall.toFixed(2)}</td><td>${c.f1.toFixed(2)}</td><td>${c.support}</td></tr>`}).join('')}</tbody></table></div><div class="tw"><table><thead><tr><th>Actual ↓ / Predicted →</th>${m.labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${m.confusion_matrix.map((row,i)=>`<tr><td>${m.labels[i]}</td>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('<hr>')}catch(x){e.innerHTML='<h3>Current backend model</h3><span style="color:var(--er)">Could not load measured metrics: '+x.message+'. Start the backend and run train_model.py.</span>'}}
$('#bs').onclick=pull;
const h=location.hash.slice(1);if(R.some(x=>x[0]==h))route=h;draw();pull();
</script></body></html>
